sonar.projectKey=BrainTease_Brain-Storm
sonar.projectName=Brain-Storm
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=apps/backend/src,apps/frontend/src,contracts/src
sonar.exclusions=**/*.spec.ts,**/*.test.ts,**/*.pact.test.ts,**/node_modules/**,**/dist/**,**/coverage/**,**/.next/**

# Test coverage
sonar.javascript.lcov.reportPaths=apps/frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/backend/coverage/lcov.info

# Quality gate
sonar.qualitygate.wait=true

# Language settings
sonar.language=ts

# Security — include test files in hotspot detection but not in coverage
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.security.sources=apps/backend/src

# ---------------------------------------------------------------------------
# Quality Gate thresholds
# These settings define the conditions the built-in "Brain-Storm" quality gate
# must meet for a PR analysis to be considered passing.
#
# Coverage threshold: new code must have ≥ 80 % line coverage.
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/node_modules/**,**/dist/**

# Duplication threshold: new code must have < 3 % duplicated lines.
# Enforced via the quality gate rule "Duplicated Lines (%)" on new code.

# Code smells: new code must introduce zero blocker/critical code smells.
# Enforced via the quality gate rule "Reliability Rating" ≥ A and
# "Maintainability Rating" ≥ A on new code.

# Viewing results:
#   1. SonarCloud dashboard: https://sonarcloud.io/project/overview?id=BrainTease_Brain-Storm
#   2. Pull request decoration: SonarCloud posts inline comments and a status
#      check on every PR automatically once the CI scan completes.
#   3. Local scan (requires SONAR_TOKEN env var):
#        npx sonar-scanner -Dsonar.token=$SONAR_TOKEN
