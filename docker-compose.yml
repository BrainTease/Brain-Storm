version: '3.8'

# Development compose — applies automatically alongside docker-compose.override.yml.
# Extends the shared base service definitions from docker-compose.base.yml so that
# healthcheck, restart policy, and image pins are not duplicated.
# Start: docker compose up -d

services:
  postgres:
    extends:
      file: docker-compose.base.yml
      service: postgres
    environment:
      POSTGRES_DB: brain-storm
      POSTGRES_USER: brain-storm
      POSTGRES_PASSWORD: brain-storm
    ports:
      - '5432:5432'
    networks:
      - brain-storm

  redis:
    extends:
      file: docker-compose.base.yml
      service: redis
    ports:
      - '6379:6379'
    networks:
      - brain-storm

  backend:
    extends:
      file: docker-compose.base.yml
      service: backend
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: brain-storm
      DATABASE_PASSWORD: brain-storm
      DATABASE_NAME: brain-storm
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - /app/node_modules
    networks:
      - brain-storm

  frontend:
    extends:
      file: docker-compose.base.yml
      service: frontend
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3000
    networks:
      - brain-storm

  contracts-builder:
    build:
      context: .
      dockerfile: contracts/Dockerfile
      target: builder
    profiles:
      - contracts
    volumes:
      - wasm_artifacts:/contracts/contracts
    networks:
      - brain-storm

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  wasm_artifacts:
    driver: local

networks:
  brain-storm:
    name: brain-storm
    driver: bridge
